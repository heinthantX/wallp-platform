services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: wallp
      POSTGRES_PASSWORD: wallp
      POSTGRES_DB: wallp
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/pg-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallp"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
